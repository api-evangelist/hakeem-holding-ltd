description: >-
  Hakeem X Technologies (HAKEEM HOLDING LTD) is a UAE-based healthcare technology company delivering
  AI-powered clinical decision support and medical education to hospitals, universities, and healthcare
  professionals across the UAE and KSA. Its flagship HakeemDx assistant turns medical research into
  instant, evidence-based answers at the point of care for physicians and pharmacists, alongside licensed
  clinical reference suites (Micromedex, EBSCO DynaMed, Isabel, GIDEON), medication-adherence and virtual
  pharmacy tooling, and medical/nursing education platforms (Lecturio, Healer case simulations, Simtics).
  Surfaced as a 500 Global portfolio company and profiled in the API Evangelist network; no public
  developer API, SDK, or portal is published at this time.
